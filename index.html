<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#145c47">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Avail CG">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Avail CG</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Icon sprite (stroke icons, 24px grid) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4.5M12 17.5h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-chev-u" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></symbol>
  <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.2L4 9M4 4v5h5M4 13a8 8 0 0 0 14.5 4.2L20 15M20 20v-5h-5"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6.5L20.5 7"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 3.3-2M2 9.3a15 15 0 0 1 4.6-2.7M12 20h.01M19 12.9a10 10 0 0 0-3.4-2.1M22 9.3A15 15 0 0 0 11 5"/></symbol>
</svg>

<!-- Sign in -->
<main id="login" class="login" hidden>
  <div class="login-card">
    <svg class="mark mark-lg" viewBox="0 0 48 48" aria-hidden="true"><use href="#mark"/></svg>
    <h1>Avail CG</h1>
    <p class="login-sub" id="loginSub">Enter your name to see and update availability.</p>
    <form id="loginForm" class="login-form" autocomplete="off" novalidate>
      <label class="field"><span class="field-label">Your name</span>
        <input id="loginName" type="text" autocomplete="given-name" autocapitalize="words" maxlength="40" placeholder="First name" enterkeyhint="next">
      </label>
      <label class="field" id="loginCodeWrap" hidden><span class="field-label">Access code</span>
        <input id="loginCode" type="password" autocomplete="off" autocapitalize="off" maxlength="60" placeholder="Ask your manager" enterkeyhint="go">
      </label>
      <button class="btn btn-primary btn-lg" type="submit" id="loginGo">Continue</button>
    </form>
    <p id="loginMsg" class="login-msg" role="alert" hidden></p>
    <p class="login-foot" id="loginFoot">Your name is saved with each change you make.</p>
  </div>
</main>

<!-- App -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><use href="#mark"/></svg>
      <span class="brand-name">Avail CG</span>
      <span id="demoTag" class="demo-tag" hidden>Demo data</span>
    </div>
    <div class="topbar-right">
      <button id="syncPill" class="sync" data-state="idle" type="button">
        <span class="dot" aria-hidden="true"></span><span id="syncLabel" class="sync-label">Saved</span>
      </button>
      <button id="userBtn" class="avatar" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">?</button>
    </div>
  </header>

  <div id="menu" class="menu" role="menu" hidden>
    <p class="menu-user" id="menuUser"></p>
    <button class="menu-item" role="menuitem" data-act="refresh"><svg class="ic"><use href="#i-refresh"/></svg>Refresh data</button>
    <button class="menu-item" role="menuitem" data-act="signout"><svg class="ic"><use href="#i-out"/></svg>Switch user</button>
  </div>

  <div id="banner" class="banner" role="alert" hidden></div>

  <main id="shell" class="shell" data-pane="list">
    <section class="listpane" aria-label="Items">
      <div class="listhead">
        <nav id="tabs" class="tabs" aria-label="Views"></nav>
        <div class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="q" type="search" placeholder="Search name, code or barcode" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search items">
          <button id="qClear" class="search-clear" type="button" aria-label="Clear search" hidden><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <p id="viewNote" class="viewnote"></p>
      </div>
      <div id="listScroll" class="listscroll">
        <ul id="list" class="list"></ul>
      </div>
    </section>

    <section id="detail" class="detailpane" aria-label="Item details"></section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>

<dialog id="confirm" class="dialog">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmBody"></p>
    <div class="dialog-actions">
      <button value="cancel" class="btn btn-ghost">Cancel</button>
      <button value="ok" class="btn btn-primary" id="confirmOk">OK</button>
    </div>
  </form>
</dialog>

<!-- Brand mark: a nursery pot with a sprout -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="12" fill="currentColor"/>
    <path d="M14 27h20l-2.4 11.2a2 2 0 0 1-2 1.6H18.4a2 2 0 0 1-2-1.6L14 27z" fill="#fff"/>
    <path d="M24 27V18" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M24 20.5c0-4 2.6-6.6 7-6.8-.1 4.1-2.8 6.8-7 6.8zM24 22.5c0-3.2-2.1-5.3-5.6-5.5.1 3.3 2.3 5.5 5.6 5.5z" fill="#fff"/>
  </symbol>
</svg>

<noscript><p style="padding:24px;font-family:sans-serif">Avail CG needs JavaScript to run.</p></noscript>
<script src="config.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
